name: Build (Emscripten / WebAssembly)

on:
  push:
    branches:
      - feat/emscripten
  pull_request:
    branches:
      - feat/emscripten
  workflow_dispatch: # lets you trigger it manually from the Actions tab

jobs:
  build-wasm:
    name: Meson + Emscripten → WASM
    runs-on: ubuntu-24.04

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      # NOTE: submodules: recursive is intentionally NOT used here.
      # The feat/emscripten branch has a broken submodule entry
      # (Minecraft.World/Emscripten/md5) that has no URL in .gitmodules.
      # We init submodules manually below so we can skip the bad one.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      # ── 1b. Init submodules (skip the broken md5 entry) ──────────────────
      - name: Init submodules (skip broken md5 entry)
        run: |
          git submodule sync
          # Init and update every submodule that actually has a URL,
          # ignoring the broken Minecraft.World/Emscripten/md5 entry.
          git submodule update --init --recursive \
            --jobs 4 \
            -- $(git submodule status --recursive \
                   | awk '{print $2}' \
                   | grep -v 'Minecraft.World/Emscripten/md5') \
          || true
          # If the md5 path is just a plain directory (no submodule URL),
          # ensure it exists so the build doesn't fail looking for it.
          mkdir -p Minecraft.World/Emscripten/md5

      # ── 2. Python (needed by emsdk & Meson) ──────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 3. Install Meson & Ninja ──────────────────────────────────────────
      - name: Install Meson and Ninja
        run: pip install meson ninja

      # ── 4. Install & activate Emscripten SDK ─────────────────────────────
      # Uses the official setup-emsdk action which correctly sets EMSDK,
      # EM_CONFIG, BINARYEN_ROOT, and PATH for all subsequent steps.
      # It also handles caching automatically.
      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: .emsdk-cache

      # ── 5. Verify toolchain ───────────────────────────────────────────────
      - name: Verify emcc
        run: emcc --version

      # ── 6. Write Meson Emscripten cross-file ─────────────────────────────
      #
      #  If your branch already ships a cross file (e.g. scripts/emscripten.ini
      #  or cross/wasm.txt), change --cross-file below to point at that file
      #  instead of the one generated here.
      #
      - name: Write Meson cross-file for Emscripten
        run: |
          python3 - << 'PYEOF'
          lines = [
            "[binaries]",
            "c       = 'emcc'",
            "cpp     = 'em++'",
            "ar      = 'emar'",
            "ranlib  = 'emranlib'",
            "nm      = 'emnm'",
            "strip   = 'emstrip'",
            "pkgconfig = 'pkg-config'",
            "",
            "[built-in options]",
            "c_args      = ['-O2']",
            "cpp_args    = ['-O2', '-std=c++17']",
            "c_link_args = ['-sALLOW_MEMORY_GROWTH=1', '-sINITIAL_MEMORY=67108864', '-sUSE_SDL=2', '-sUSE_WEBGL2=1', '-O2']",
            "cpp_link_args = ['-sALLOW_MEMORY_GROWTH=1', '-sINITIAL_MEMORY=67108864', '-sUSE_SDL=2', '-sUSE_WEBGL2=1', '-O2']",
            "",
            "[properties]",
            "needs_exe_wrapper = true",
            "",
            "[host_machine]",
            "system     = 'emscripten'",
            "cpu_family = 'wasm32'",
            "cpu        = 'wasm32'",
            "endian     = 'little'",
          ]
          with open('emscripten.ini', 'w') as f:
            f.write('\n'.join(lines) + '\n')
          PYEOF

      # ── 7. Install GLM (header-only, must be visible to emcc) ────────────
      - name: Install GLM
        run: sudo apt-get install -y libglm-dev

      # ── 7b. Patch shiggy for wasm32 ──────────────────────────────────────
      # shiggy/src/shims.c has a _Static_assert that pthread_t is 8 bytes
      # (assumes a 64-bit host). In wasm32, sizeof(pthread_t) == 4, so the
      # assertion always fails. Replace the hard == 8 check with >= 4.
      - name: Patch shiggy pthread_t assertion for wasm32
        run: |
          SHIMS=subprojects/shiggy/src/shims.c
          if [ -f "$SHIMS" ]; then
            sed -i \
              's/_Static_assert(sizeof(pthread_t) == 8, "pthread_t must be 8 bytes")/_Static_assert(sizeof(pthread_t) >= 4, "pthread_t must be at least 4 bytes")/' \
              "$SHIMS"
            echo "Patched $SHIMS"
          else
            echo "WARNING: $SHIMS not found — skipping patch"
          fi

      # ── 8. Configure (meson setup) ────────────────────────────────────────
      - name: Configure with Meson
        run: |
          meson setup build \
            --cross-file emscripten.ini \
            --buildtype release

      # ── 8. Compile ────────────────────────────────────────────────────────
      - name: Compile
        run: meson compile -C build -j$(nproc)

      # ── 9. Upload build artefacts ────────────────────────────────────────
      - name: Upload WASM build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: 4jcraft-wasm
          # Adjust the glob below if the output lives in a different sub-folder
          path: |
            build/**/*.js
            build/**/*.wasm
            build/**/*.html
          retention-days: 30
          if-no-files-found: warn
